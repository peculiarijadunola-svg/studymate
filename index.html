<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      margin: 10px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 18px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 18px;
      border: 2px solid #ddd;
      border-radius: 15px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #4f46e5;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 10px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .result {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      min-height: 100px;
    }

    .result h2 {
      margin-top: 0;
    }

    @media (max-width: 500px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📚 StudyMate</h1>
    <p>Understand your notes. Study smarter.</p>
  </div>

  <div class="container">

    <textarea id="notes"
      placeholder="Paste your study notes here..."></textarea>

    <div class="buttons">
      <button onclick="explain()">🧠 Explain</button>
      <button onclick="summarize()">📝 Summarize</button>
      <button onclick="quiz()">❓ Quiz Me</button>
    </div>

    <div class="result" id="result">
      <h2>Ready to study?</h2>
      <p>Paste your notes above and choose an option.</p>
    </div>

  </div>

  <script>

    function getNotes() {
      return document.getElementById("notes").value.trim();
    }

    function show(text) {
      document.getElementById("result").innerHTML = text;
    }

    function explain() {
      const notes = getNotes();

      if (!notes) {
        show("<h2>⚠️ Add your notes</h2><p>Paste something first.</p>");
        return;
      }

      show(`
        <h2>🧠 Explanation</h2>
        <p>Here are your study notes:</p>
        <p>${notes}</p>
        <p><strong>StudyMate AI will turn this into a simple explanation soon.</strong></p>
      `);
    }

    function summarize() {
      const notes = getNotes();

      if (!notes) {
        show("<h2>⚠️ Add your notes</h2><p>Paste something first.</p>");
        return;
      }

      const words = notes.split(/\s+/);
      const summary = words.slice(0, 50).join(" ");

      show(`
        <h2>📝 Summary</h2>
        <p>${summary}${words.length > 50 ? "..." : ""}</p>
      `);
    }

    function quiz() {
      const notes = getNotes();

      if (!notes) {
        show("<h2>⚠️ Add your notes</h2><p>Paste something first.</p>");
        return;
      }

      show(`
        <h2>❓ Quiz</h2>
        <p>What is the main idea of these notes?</p>
        <p><em>Use your notes to find the answer.</em></p>
        <hr>
        <p><strong>Coming next:</strong> StudyMate will automatically generate real quiz questions from your notes.</p>
      `);
    }

  </script>

</body>
</html>
